name: Feature / data request
description: Suggest a new tool, dataset, lab, monitor or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: Idea, description: "What should exist, and who is it for?" }
    validations: { required: true }
  - type: textarea
    id: source
    attributes: { label: Data source / prior art, description: "Public APIs, specs (EIP/BIP), repos — everything we ship must use real, verifiable sources." }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Hub, Tools, Data API, SDK, MCP server, Labs, AI services, Monitors, Other]
